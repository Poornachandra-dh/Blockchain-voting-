version: '3.7'

# AegisVote Hyperledger Fabric 3-Organization Consortium Network
# Org 1: Election Commission (ec.gov)
# Org 2: Party Observer (observer.org)
# Org 3: Civil Society NGO (civilsociety.ngo)
# Orderer: Raft Cluster (aegis.election)
# State DB: CouchDB for each peer

networks:
  aegis_fabric_net:
    name: aegis_fabric_net

volumes:
  orderer.aegis.election:
  peer0.org1.ec.gov:
  peer0.org2.observer.org:
  peer0.org3.civilsociety.ngo:
  couchdb0_data:
  couchdb1_data:
  couchdb2_data:

services:
  # ==========================================
  # Raft Orderer Node
  # ==========================================
  orderer.aegis.election:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.aegis.election
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    ports:
      - 7050:7050
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./crypto-config/ordererOrganizations/aegis.election/orderers/orderer.aegis.election/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/aegis.election/orderers/orderer.aegis.election/tls/:/var/hyperledger/orderer/tls
      - orderer.aegis.election:/var/hyperledger/production/orderer
    networks:
      - aegis_fabric_net

  # ==========================================
  # CouchDB Instances (World State Storage)
  # ==========================================
  couchdb0:
    image: couchdb:3.3.2
    container_name: couchdb0
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    volumes:
      - couchdb0_data:/opt/couchdb/data
    networks:
      - aegis_fabric_net

  couchdb1:
    image: couchdb:3.3.2
    container_name: couchdb1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "6984:5984"
    volumes:
      - couchdb1_data:/opt/couchdb/data
    networks:
      - aegis_fabric_net

  couchdb2:
    image: couchdb:3.3.2
    container_name: couchdb2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "7984:5984"
    volumes:
      - couchdb2_data:/opt/couchdb/data
    networks:
      - aegis_fabric_net

  # ==========================================
  # Org 1: Election Commission Peer
  # ==========================================
  peer0.org1.ec.gov:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org1.ec.gov
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aegis_fabric_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.org1.ec.gov
      - CORE_PEER_ADDRESS=peer0.org1.ec.gov:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.ec.gov:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.ec.gov:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.ec.gov:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    ports:
      - "7051:7051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/org1.ec.gov/peers/peer0.org1.ec.gov/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/org1.ec.gov/peers/peer0.org1.ec.gov/tls:/etc/hyperledger/fabric/tls
      - peer0.org1.ec.gov:/var/hyperledger/production
    depends_on:
      - couchdb0
      - orderer.aegis.election
    networks:
      - aegis_fabric_net

  # ==========================================
  # Org 2: Party Observer Peer
  # ==========================================
  peer0.org2.observer.org:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org2.observer.org
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aegis_fabric_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.org2.observer.org
      - CORE_PEER_ADDRESS=peer0.org2.observer.org:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.observer.org:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.observer.org:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.observer.org:8051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    ports:
      - "8051:8051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/org2.observer.org/peers/peer0.org2.observer.org/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/org2.observer.org/peers/peer0.org2.observer.org/tls:/etc/hyperledger/fabric/tls
      - peer0.org2.observer.org:/var/hyperledger/production
    depends_on:
      - couchdb1
      - orderer.aegis.election
    networks:
      - aegis_fabric_net

  # ==========================================
  # Org 3: Civil Society NGO Peer
  # ==========================================
  peer0.org3.civilsociety.ngo:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.org3.civilsociety.ngo
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=aegis_fabric_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.org3.civilsociety.ngo
      - CORE_PEER_ADDRESS=peer0.org3.civilsociety.ngo:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org3.civilsociety.ngo:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org3.civilsociety.ngo:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org3.civilsociety.ngo:9051
      - CORE_PEER_LOCALMSPID=Org3MSP
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb2:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    ports:
      - "9051:9051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/org3.civilsociety.ngo/peers/peer0.org3.civilsociety.ngo/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/org3.civilsociety.ngo/peers/peer0.org3.civilsociety.ngo/tls:/etc/hyperledger/fabric/tls
      - peer0.org3.civilsociety.ngo:/var/hyperledger/production
    depends_on:
      - couchdb2
      - orderer.aegis.election
    networks:
      - aegis_fabric_net

  # ==========================================
  # CLI Container for Administration & Chaincode
  # ==========================================
  cli:
    image: hyperledger/fabric-tools:2.5
    container_name: aegis_cli
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.org1.ec.gov:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/org1.ec.gov/peers/peer0.org1.ec.gov/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/org1.ec.gov/peers/peer0.org1.ec.gov/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/org1.ec.gov/peers/peer0.org1.ec.gov/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/org1.ec.gov/users/Admin@org1.ec.gov/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
      - ./scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts
    depends_on:
      - orderer.aegis.election
      - peer0.org1.ec.gov
      - peer0.org2.observer.org
      - peer0.org3.civilsociety.ngo
    networks:
      - aegis_fabric_net
